id: detail-360
name: Case-360 detail surface (multi-tab record console)
applies_to: userview+form
rule: >-
  A case-bearing record's detail screen is a 360° console, never a plain form: a persistent
  context header (party identity card · record type+number · status+since · key figures ·
  assigned officer, CTX-02) above tabs — overview (the record's own fields) · one tab per
  child aggregate (e.g. debt lines, notices) · history (the engine's audit trail) · actions
  (the role+state-legal transitions with guards and consequences). Party 360° one click from
  the header (CTX-03). Every case-bearing module inherits the pattern; it is never hacked in
  as a one-off screen.
realised_by: >-
  L1 `layout: detail_360` + section `header: true` -> project_forms.split_detail_360 (console
  with pinned header sections + per-tab forms over the same table; the Lifecycle-action block
  becomes the Actions tab with TransitionGuard attached) -> gen_forms `multipaged` element
  (enterprise MultiPagedForm displayMode=tab, ajaxMode; encoding verified against the
  JogetDxShowcase app — ADR-068, kit). Styling via the theme TabComponent tokens (--jgt-tab-*).
  Context-header CHROME (identity card, status-since) still needs its own pattern (CTX-02).
maturity: piloted    # deployed + API-verified on dm-core (jdx7); stable after the owner's walkthrough
source: "dm-core M7 W-9 · UX-01 CTX-02/CTX-03 · design: rsr/evidence/tax/dm-core/design/CASE360-DESIGN.md"
deferred: ["party-360 target needs a taxpayer-register surface (Run 3 — no registry integration yet)",
           "instalments/objections/documents tabs (waived procedures, Run 2+)"]
