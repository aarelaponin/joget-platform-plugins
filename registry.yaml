  - id: joget-smart-search
    module: plugins/joget-smart-search
    artifact: global.govstack:joget-smart-search
    version: 8.2.0                  # 8.1-SNAPSHOT -> 8.2.0 (minor: optional keys added; METHOD-2026-09-28-01)
    category: foundation
    govstack_bb: [Digital Registries]
    tier: P
    status: active
    ships: code
    license: govstack
    dx_compat: ["8.1", "9.x"]
    java_release: 17
    summary: >
      Partial-knowledge search element over ANY Joget registry table, config-driven (no
      per-registry Java). Renders a "Find <entity>" widget with a confidence engine; the
      subject (farmer / taxpayer / ...) and the search criteria are parameters. Backed by a
      config-driven REST search (RegistrySearchService) mapping any table columns to the
      element result contract. Farmer path unchanged under default config.
      Since 8.2.0 the element also searches a record its own properties name (`recordTable`, a
      table or view): exactly by `exactColumn`, else by a fragment of `fragmentColumn`; shows
      `resultColumns`; fills the fields `populate` names from the record chosen and locks the
      fields `locks` names; says `notFound` when nothing is found. Its page asks
      RecordSearchWebService with the settings the server sealed when it drew the form, so no API
      definition, API id or key is needed. The kit writes every one of them from the model
      (joget-spec-kit tools/project_forms.py, record_search).
    registers:
      - global.govstack.smartsearch.element.SmartSearchElement
      - global.govstack.smartsearch.api.SmartSearchApiPlugin
      - global.govstack.smartsearch.element.RecordSearchWebService
    contract:
      element_class: global.govstack.smartsearch.element.SmartSearchElement
      # form-element knobs the generators target (gen_forms smart_search emit; the record search's
      # through the field's props):
      config_keys: [entityLabel, simpleSearch, displayColumns, storeValue, populate, idField,
                    apiEndpoint, apiId, apiKey, nationalIdPattern, nationalIdMinLength,
                    recordTable, exactColumn, fragmentColumn, resultColumns, locks, notFound]
      # populate: "srcField:formFieldId,..." — auto-fills sibling form fields on select
      #   (client-side, in selectFarmer->populateFields; the PRE-01/PRE-04 fix). WP-7 adds value-shapes.
      # generic-registry backend knobs (SmartSearchApiPlugin "Generic Registry" section):
      api_config_keys: [registryTable, idColumn, identifierColumn, primaryColumn,
                        secondaryColumn, extraColumn1, extraColumn2, searchColumns]
    binding:
      # How a spec REFERS to this plugin — it does not hand-wire the widget:
      rule: >
        A form field that is a ref to a data-dictionary set with kind=md.registry (operational
        scale, editable) auto-projects to a smart_search element in
        joget-spec-kit/tools/project_forms.py. The spec sets the knobs above under the field
        config; entityLabel sets the subject, simpleSearch=true drops location criteria so
        name/id alone can search. Since 8.2.0 the projector also writes the record search's
        properties from the model: the record the reference names, its key (searched exactly
        and stored), the attribute the reference shows (searched by a fragment), the columns of
        the list config.search_list names, config.populate's fills and the fields they lock, and
        config.not_found's words.
    provenance: >
      promoted from lst-frm-prj/plugins (project-neutral: pom renamed, dev cruft pruned; Lesotho
      district defaults remain behind simpleSearch=false, tracked as Issue #20). Proven live returning taxpayers on jdx7.
      The record search (8.2.0, METHOD-2026-09-28-01): RecordSearchSettings, RecordSearch,
      RecordSearchWebService, RecordSearchElement.ftl and record-search.js, with the plugin's
      first tests (mvn test; node --test src/test/js/record-search.test.js). Built, not deployed.
    source_of_truth: this repo

