# joget-platform-plugins — plugin registry (single source of truth)
#
# This is the shared runtime-extension library for ANY spec-to-code-on-Joget development.
# It is NOT GovStack-specific: GovStack Building Blocks are one (important) tagging vocabulary,
# not the organising axis. joget-spec-kit generates config against the `contract` of each entry
# WITHOUT importing any Java. Schema: docs/registry.schema.yaml.
#
# TAXONOMY
#   category:
#     foundation        horizontal capability, domain-agnostic — works for any Joget app
#     pack:<domain>      capability aligned to a domain (e.g. pack:registration, pack:payments)
#   govstack_bb:         OPTIONAL tag on packs that align to a GovStack Building Block. Verified
#                        vocabulary (specs.govstack.global, 2025 release):
#                        Cloud Infrastructure · Consent · Content Management System ·
#                        Digital Registries · E-Marketplace · E-Signature · GIS · Identity ·
#                        Information Mediator · Messaging · Payments · Registration · Scheduler · Wallet
#
# tier:   G = generic-Joget (any app) · P = pattern-reusable (genericised then shipped)
# status: active | planned | deprecated      ships: code | pattern

registry_version: 0.12.0  # 0.12.0: A LIST SORTED AS THE PLATFORM READS IT (METHOD-2026-11-05-17,
                          #        6 Nov 2026; MT-DM's hand-off of 5 Nov 2026, items 21, 10, 18).
                          #        Generators only; no plugin, no Java. gen_datalists:
                          #        a list's `order` is written "1" descending and "" ascending, the
                          #        platform's own values (wflow-core 9.0.7: DataList sorts
                          #        descending only where the order is ORDER_DESCENDING_VALUE "1").
                          #        It was "DESC" and "ASC", so every descending list was shown
                          #        ascending. This changes every list's `order` by design: the kit
                          #        reads both spellings by one reader (reconcile_maps.order_dir),
                          #        so a list rebuilt with 0.12.0 reads back through harvest and the
                          #        reconcile as the list it was, not as a console edit.
                          #        A select filter's optional `multiple` writes the platform's
                          #        "true" (a choice of several); a column's optional formatter
                          #        `currency` shows an amount with its grouping and decimals (and
                          #        an optional symbol) through BeanShellFormatter, the platform
                          #        9.0.7 having no number formatter. A spec with neither key emits
                          #        exactly the 0.11.0 filter and column (asserted literally).
                          #        Tests: test_gen_datalists_order.py.
                          # 0.11.0: THE INTERACTION PATTERNS REACH THE BUILD (METHOD-2026-09-25-11,
                          #        25 Sep 2026). With the 0.10.0 generators, on a running application
                          #        a category the spec hides was shown, a list's filter over a list
                          #        of values could offer only the values written into it at the
                          #        build, and a list's date column was not shown day first.
                          #        Generators only; no plugin, no Java.
                          #        gen_userview: a category's `hide` is written "yes" when the spec
                          #        hides it (UserviewCategory's own checkbox value); it was written
                          #        empty whatever the spec said (the kit's totality T112 named each).
                          #        gen_datalists, select filter: `optionsBinder` places the platform's
                          #        own options binder on SelectBoxDataListFilterType, whose rows then
                          #        replace the inline options when the list is shown; `controlField`
                          #        names an EARLIER select filter of the same list, so a divided list
                          #        is chosen in two steps, category then value (the platform keeps the
                          #        values whose grouping holds the category chosen). A control that is
                          #        not an earlier select filter, or not a plain name, is REFUSED: the
                          #        platform's script finds it by its name unquoted, and would leave the
                          #        value's drop-down empty with no word why.
                          #        gen_datalists, date column: the spec's `format` (the day-first
                          #        pattern) is DateFormatter's displayFormat; dataFormat is the format
                          #        the value is stored in (the spec's `dataFormat`, else yyyy-MM-dd, or
                          #        yyyy-MM-dd HH:mm:ss for a pattern that shows the time). It had been
                          #        the pattern in dataFormat and displayFormat empty, so a stored
                          #        2026-09-25 failed to parse and the column showed the stored value.
                          #        A spec using none of the new filter keys emits exactly the 0.10.0
                          #        filter (asserted literally); the date column and a hidden category
                          #        change the output by design. Tests: test_gen_userview.py,
                          #        test_gen_datalists_interaction.py.
                          # 0.10.0: NO PROCESS-WIDE AIM IN A SHARED BUNDLE (breaking).
                          #        joget-event-chain is a LIBRARY bundle: two consumers in one
                          #        JVM share one class, so CaseEventWriter's static default
                          #        event form id was one field for the whole process. When
                          #        joget-transition-guard (statusEvent, tax registration) was
                          #        installed beside cmbb-plugins (cmEvent, collection
                          #        management) on 3 Aug 2026, the last Activator to start won
                          #        and every CMBB/DMBB case event was appended to the
                          #        registration module's hash-linked chain - silently, until a
                          #        regression sweep came back 7/24 green on 11 Aug with an
                          #        empty cmEvent and 468 foreign rows in app_fd_statusEvent.
                          #        REMOVED (breaking, deliberately): CaseEventWriter's
                          #        DEFAULT_EVENT_FORM, setDefaultEventFormId,
                          #        getDefaultEventFormId and the one-arg constructor;
                          #        ChainVerifyService's one-arg constructor; StatusManager's
                          #        one-arg constructor. CaseEventWriter(dao, eventFormId) is
                          #        now the only way to build one and a blank id THROWS - an
                          #        unaimed writer is never silently pointed somewhere
                          #        plausible. Every consumer names its own carrier at the call
                          #        site (24 sites); both Activators lose their binding line.
                          #        Pinned by CaseEventWriterTest.twoWritersInOneJvm_doNotCross.
                          #        Sweep re-run after the fix: 24/24 green.
                          #        ARTIFACT VERSIONS BUMPED (AL, Gate G1 ruling G1-4, 12 Aug
                          #        2026 - supersedes this entry's first draft, which had left
                          #        them at 1.0.0 per the repo's registry_version-carries-the-
                          #        changelog convention). A removal from an exported package
                          #        gets the honest semver signal:
                          #          MAJOR 1.0.0 -> 2.0.0  joget-event-chain (CaseEventWriter
                          #                 DEFAULT_EVENT_FORM / set- / getDefaultEventFormId /
                          #                 (FormDataDao) ctor; ChainVerifyService (FormDataDao)
                          #                 ctor REMOVED) and joget-status-manager
                          #                 (StatusManager(FormDataDao) ctor REMOVED).
                          #          MINOR 1.0.0 -> 1.1.0  joget-decision-approval,
                          #                 joget-case-ops, joget-sla, joget-transition-guard,
                          #                 examples/gam-status-demo - their own exported API is
                          #                 source-compatible, but each imports a package whose
                          #                 export version has majored, so each JAR must be
                          #                 replaced in lockstep (Import-Package range moves
                          #                 [1.0,2) -> [2.0,3)).
                          #        This is a DEPLOYMENT-BREAKING signal by design: bnd derives
                          #        each consumer's Import-Package range from the export version,
                          #        so a 1.0.0-built consumer left behind on an instance now
                          #        FAILS TO RESOLVE instead of silently binding to an API that
                          #        no longer means what it did. ALL SEVEN MUST BE DEPLOYED
                          #        TOGETHER: joget-event-chain, joget-status-manager,
                          #        joget-decision-approval, joget-transition-guard,
                          #        joget-case-ops, joget-sla, and the consumer's own bundle.
                          #        Consumers pinned to 1.0.0 that the bump surfaced, re-pinned
                          #        and rebuilt in the same change, none silently: the five
                          #        in-repo modules above, examples/gam-status-demo, and - in a
                          #        SEPARATE repo - cmbb-plugins (debt-management-platform,
                          #        03_debt_management/cmbb/plugins/cmbb-plugins, itself
                          #        8.1-SNAPSHOT so it carries no version of its own to move).
                          #        No other consumer of either artifact exists in any repo on
                          #        this workstation.
                          #        Open for the platform owner (DM-2/DM-3 in the debt-management
                          #        PLATFORM_DEMANDS.md): eleven more process-wide statics of the
                          #        same shape remain across these bundles, none colliding today
                          #        only because no installed bundle happens to set them; and the
                          #        preflight lint needs a CROSS-BUNDLE rule, since no per-app
                          #        artefact check can see a defect that lives in a pair of them.
                          # 0.9.12: FULL FORM FIDELITY. The owner set the round-trip
                          #        objective for the farmersPortal form family: regenerated
                          #        forms must FULLY equal the deployed ones, no accepted
                          #        losses. gen_forms gains two channels, both inert when
                          #        unused (byte-identical emission, asserted literally in
                          #        test_gen_forms_fidelity.py): field type `verbatim`
                          #        re-emits a deployed element untouched ({className,
                          #        properties} from the export - the 12 foreign elements on
                          #        the wizard screens carry their full config there), and a
                          #        field `props` dict merges into the emitted properties
                          #        LAST (deployed placeholder x38, maxlength x15, hidden
                          #        value x3, authored validators - 6 of the 7 deployed
                          #        validator shapes are not derivable from `required`).
                          #        The select lookup binder also reads groupingColumn /
                          #        useAjax / emptyLabel (deployed: 'district_code',
                          #        'category', 'true', '-- Select District --'), and a
                          #        field-level `column` tag beats the i%cols round-robin
                          #        (farmerIncomePrograms splits 5/6 - MORE fields on the
                          #        right, which i%cols can never produce); defaults
                          #        exactly the 0.9.11 emission.
                          # 0.9.11: THE JOINED REGISTER. gen_datalists'
                          #        AdvancedFormRowDataListBinder emission gains `joins` - the
                          #        shape both deployed farmersPortal registers carry (measured
                          #        2026-08-08): child TABLES joined on <table>.<fk> = parent id
                          #        (joinFieldId always 'id'; the deployed key is the TABLE -
                          #        farm_location, not the form id farmerResidency). A companion
                          #        register reads every column THROUGH the joins; without them
                          #        the two lists were unexpressible and forms-02 shipped without
                          #        its registers. Absent joins the emission is byte-identical to
                          #        0.9.10 (asserted literally in test_gen_datalists_joins.py).
                          # 0.9.10: THE WIZARD IS A PROJECTION. gen_forms' multipaged element
                          #        (in the library since detail_360/ADR-068) gains the keys the
                          #        two DEPLOYED farmersPortal wizards actually carry, measured
                          #        2026-08-08: per-page subFormParentId (the child fk column),
                          #        parentSubFormId (the authored parent-side slot name) and
                          #        validate (both deployed wizards set 'true' on every page -
                          #        the empty-validate VAL-03 rule is a detail_360 TABS rule);
                          #        root partiallyStore and storeMainFormOnPartiallyStore
                          #        (independent on the platform: the farmer wizard sets the
                          #        second with the first EMPTY) and authorable Prev/Next button
                          #        labels ('Previous' on the deployed farmer wizard). Every new
                          #        key defaults to the exact 0.9.9 emission, so a spec carrying
                          #        none of them (every detail_360 tabs element) is byte-identical
                          #        - the bump is a new degree of freedom, not a behaviour change.
                          #        Closes the L1 purpose:wizard refusal (project_forms.py:468,
                          #        joget-spec-kit) for the .jwa round-trip mission.
                          # 0.9.9: CREATE WITH ONE FORM, EDIT WITH ANOTHER. gen_userview's
                          #        CrudMenu derived addFormId AND editFormId from the single
                          #        `form` key, so a menu could not open an existing record with
                          #        a form other than the one it creates with. A `purpose: create`
                          #        form carries no lifecycle Action select — correct, a create
                          #        advances nothing — so for EVERY entity with a lifecycle the
                          #        create form and the edit form legitimately differ. The
                          #        tax-clearance applicant could open their own draft and had no
                          #        control to submit it: TC-FR-001, the first line of the model,
                          #        unreachable behind a full green board (totality 0 blocking,
                          #        drift hand_edited 0, ui-probe 7/7). The userview spec now
                          #        carries an optional `editFormId`, emitted from the crud menu's
                          #        `edit_form` key (application-model.schema.yaml). Absent it the
                          #        output is byte-identical to 0.9.8 — the bump is a new degree of
                          #        freedom, not a behaviour change.
                          # 0.9.8: TYPE-THE-KEY, SEE-THE-NAME. joget-lookup-field's watched
                          #        field may now be a TEXTFIELD, not only a SelectBox: the
                          #        lookup fires on change/blur AND on debounced typing, so a
                          #        TIN typed into a text box shows the registered name without
                          #        a reload. A dropdown does not scale past a demo register and
                          #        browse-the-register-first was rejected three times. An
                          #        unmatched key now CLEARS the value and says not-found — it
                          #        used to blank the field silently, indistinguishable from a
                          #        field nobody filled. gen_forms realizes the element
                          #        (`lookup_field`); joget-require-guard's `exists` leg accepts
                          #        an EMPTY whenField, making a referential precondition
                          #        statable on a CREATE form (which carries no lc_action), so
                          #        an unknown key is refused by the STORE and not only by the
                          #        screen (SR-3).
                          # 0.9.7: gen_userview no longer hardcodes readonly="true" on every
                          #        FormMenu. It had, since the generator was written, so NO form
                          #        menu the kit ever emitted could be submitted — "New
                          #        registration" rendered uneditable. Invisible to every acceptance
                          #        suite, which drives the data API rather than the screen; found
                          #        by the owner clicking the fifteenth deployment of a green app.
                          #        `readonly: true` on the menu keeps display-only forms
                          #        expressible; it is now a choice, not the only outcome.
                          # 0.9.6: joget-require-guard registered, and gen_forms realizes an
                          #        entity's `validations` on the form root — a conditional
                          #        requirement declared in the model was enforced by nothing on
                          #        the Joget path (it reached only the RegBB emitter). gen_forms
                          #        REFUSES a form that would need both guards on the one root
                          #        slot, and refuses require_grids/min_entries, which this
                          #        validator does not realize.
                          # 0.9.5: gen_forms SelectBox validation accepts an optionsBinder-backed
                          #        select (a lookup over another form) — it indexed p["options"]
                          #        unconditionally and raised KeyError on any ref attribute.
                          # 0.9.4: joget-unique-guard registered — root-placed uniqueness FormValidator (ADR-076, CC-01 WP-2). 0.9.3: joget-smart-search source promoted into this repo (module + build; source_of_truth=this repo). 0.9.2: joget-smart-search registered (ADR-004).

plugins:

  - id: joget-form-prefill
    module: plugins/joget-form-prefill
    artifact: com.fiscaladmin.joget:joget-form-prefill
    version: 1.1.0                  # 1.1.0 (joget-spec-kit METHOD-2026-10-24-01, 24 Oct 2026): the bundle
                                    # also registers GridRowsPrefillBinder, a grid's LOAD binder that loads
                                    # its lines as the platform's MultirowFormBinder does and, on a NEW
                                    # record, carries them from the rows of the record the form is opened
                                    # on (the kit's `rowsFrom`); gen_forms writes it on a grid whose spec
                                    # carries `rowsFrom`, and gen_userview writes a form menu's `after_save`
                                    # as its redirection after the save. registry_version stays 0.11.0: a
                                    # spec carrying neither key is emitted byte for byte as before
                                    # (test_gen_second_pass.py), and a bump would refuse every build pinned
                                    # to 0.11.0. The registry had said 1.0.0 since the pom moved to 1.0.1.
    category: foundation
    tier: G
    status: active
    ships: code
    license: proprietary            # FiscalAdmin OÜ; candidate to open-source (see backlog)
    dx_compat: ["8.1", "9.x"]
    java_release: 11
    summary: >
      Configurable form LOAD binder that pre-populates a NEW record from a related
      record by configuration only (no per-form Java).
    registers:
      - com.fiscaladmin.joget.formprefill.FormPrefillLoadBinder
      - com.fiscaladmin.joget.formprefill.GridRowsPrefillBinder
    contract:
      binder_class: com.fiscaladmin.joget.formprefill.FormPrefillLoadBinder
      config_keys: [enabled, onlyOnAdd, keySources, formId, table, matchField,
                    filters, orderBy, orderNumeric, pickFirst, related, mappings, constants]
      grid_binder_class: com.fiscaladmin.joget.formprefill.GridRowsPrefillBinder
      grid_config_keys: [formDefId, foreignKey, rowsTable, parentField, keyParam, refField,
                         refColumn, where, map]
    provenance: proven in production public-sector implementations (DX8 + DX9), multi-instance
    source_of_truth: this repo   # promoted from 03_debt_management/shared-plugins

  - id: joget-unique-guard
    module: plugins/joget-unique-guard
    artifact: com.fiscaladmin.joget:joget-unique-guard
    version: 1.0.0
    category: foundation
    tier: G
    status: active
    ships: code
    license: proprietary
    dx_compat: ["9.x"]
    java_release: 11
    summary: >
      Generic count-then-refuse FormValidator enforcing declared multi-attribute uniqueness
      with an optional HQL scope predicate (the one-open-case-per-TIN shape). Attached to the
      form ROOT validator slot (ADR-076) so it always runs and cannot be skipped for a readonly
      key (D-067/D-068); derives form id + table from the root, so no formDefId is configured.
    registers:
      - com.fiscaladmin.joget.uniqueguard.UniqueGuard
    contract:
      validator_class: com.fiscaladmin.joget.uniqueguard.UniqueGuard
      config_keys: [attrs, where, message]
    provenance: CH-01 WP-H / CC-01 WP-2; live t02 refusal proven on jdx7/9.0.5 (ADR-076/077); 9.0.7 pending WP-6
    source_of_truth: this repo

  - id: joget-require-guard
    module: plugins/joget-require-guard
    artifact: com.fiscaladmin.joget:joget-require-guard
    version: 1.0.0
    category: foundation
    tier: G
    status: active
    ships: code
    license: proprietary
    dx_compat: ["9.x"]
    java_release: 11
    summary: >
      Conditional-requirement FormValidator: when a named field holds a named value, named
      fields must be non-empty. The Joget realization of the model's entities[].validations,
      which until 0.9.6 reached only the RegBB emitter — so a conditional requirement in the
      model validated, generated and deployed while no form enforced it. Root-placed for the
      same reason as UniqueGuard (ADR-076): the root always runs and cannot be skipped by a
      readonly or hidden field. One root slot, so a form carries one guard or the other;
      gen_forms refuses a form needing both rather than dropping one.
    registers:
      - com.fiscaladmin.joget.requireguard.RequireGuard
    contract:
      validator_class: com.fiscaladmin.joget.requireguard.RequireGuard
      config_keys: [rules, exists]
      binding_rule: >
        `exists` with an EMPTY whenField is UNCONDITIONAL — the precondition holds on every
        save, which is what a REFERENTIAL rule needs (a create form carries no lc_action to
        condition on). Such a rule skips an empty correlation value: blank is a requiredness
        question the `rules` leg owns.
    provenance: UB-14b; found by executing registration's t03 (REG-FR-041) against the deployed app rather than reading it
    source_of_truth: this repo

  - id: form-creator-api
    module: plugins/form-creator-api
    artifact: global.govstack:form-creator-api
    version: 8.1-SNAPSHOT
    category: foundation
    tier: G
    status: active
    ships: code
    license: govstack
    dx_compat: ["8.1"]
    java_release: 11
    summary: >
      Programmatic Joget artefact-creation backbone: creates forms, datalists, userviews,
      CRUD and API-Builder endpoints, and seeds fixtures, over a REST API.
    registers:
      - global.govstack.formcreator.lib.FormCreatorServiceProvider
    contract:
      api_spec: docs/formCreatorApi-openapi.yaml
      config_keys: [appId, formJson, formIds, datalistJson, userviewJson]
    provenance: proven push tooling across production public-sector implementations
    source_of_truth: this repo   # promoted from lst-frm-prj/plugins (client refs scrubbed)

  - id: joget-lookup-field
    module: plugins/joget-lookup-field
    artifact: global.govstack:joget-lookup-field
    version: 8.1-SNAPSHOT
    category: foundation
    tier: G
    status: active
    ships: code
    license: govstack
    dx_compat: ["8.1", "9.x"]
    java_release: 17
    summary: >
      Form element that watches a SelectBox OR a TextField and auto-populates a field from a
      related record (field-level, live). The TextField case is the one that scales: a key
      typed into a text box resolves on change/blur and on debounced input, so a register of
      thousands needs neither a dropdown nor a browse-first detour. An unmatched key clears
      the value and states not-found — never a stale value beside a key that resolves to
      nothing. Complements joget-form-prefill (form-level, on-load).
    registers:
      - global.govstack.lookupfield.element.LookupFieldElement
    contract:
      element_class: global.govstack.lookupfield.element.LookupFieldElement
      config_keys: [sourceFieldId, lookupFormId, lookupColumn, lookupKeyColumn, updateOn,
                    displayType, inputDebounceMs, notFoundMessage]
      binding_rule: >
        The screen-side half only. A key that must EXIST is enforced at store time by
        joget-require-guard's unconditional `exists` leg (empty whenField), which the forms
        projector emits alongside this element. Never claim referential integrity from this
        element alone (SR-3).
    provenance: promoted from lst-frm-prj/plugins (project-neutral source)
    source_of_truth: this repo

  - id: joget-concat-field
    module: plugins/joget-concat-field
    artifact: global.govstack:joget-concat-field
    version: 8.1-SNAPSHOT
    category: foundation
    tier: G
    status: active
    ships: code
    license: govstack
    dx_compat: ["8.1", "9.x"]
    java_release: 17
    summary: >
      Form element that concatenates multiple field values with configurable separator,
      format, prefix/suffix and empty-skipping — recomputed live as inputs change.
    registers:
      - global.govstack.concatfield.element.ConcatFieldElement
    contract:
      element_class: global.govstack.concatfield.element.ConcatFieldElement
      config_keys: [sourceFields, separator, formatPattern, prefix, suffix, skipEmpty, updateOn, displayType]
    provenance: promoted from lst-frm-prj/plugins (project-neutral source)
    source_of_truth: this repo

