  - id: joget-transition-guard
    module: plugins/joget-transition-guard
    artifact: com.fiscaladmin.joget:joget-transition-guard
    version: 1.9.0
    category: foundation
    tier: P
    status: active
    ships: code
    license: proprietary            # FiscalAdmin OÜ
    dx_compat: ["9.x"]              # run on DX 9 only so far
    java_release: 11
    depends_on: [joget-event-chain, joget-status-manager]
    summary: >
      Config-driven lifecycle transition guard, wired as a form post-submission processor.
      On save it reads the move chosen, looks it up in its `transitions` config, drives
      StatusManager.apply (checked against the mmEntityTransition seed), stamps the move's
      set-now fields and saves once; an illegal move is recorded, not applied. Two modes:
      the form saved IS the record (the engine surface), or, with `targetField` set, the
      form saved is a trigger form (an act) naming the record it moves, which the guard loads
      through `targetForm`, moves, copies `copyFields` onto, saves, and reports on the act.
      With `checkRoles` set, a move whose mmEntityTransition row names roles the actor holds
      none of (directory group ids) is refused and recorded as refused. A set-now field marked
      `@date` is written as the day alone, and an applied move writes the rows its `audit` (the
      history entry) and `notify` (the alert) lines name (1.3.0). A guard is terms joined by
      `and`; a term `none(<entity> where <condition>)` counts another record's rows, read through
      the form and table `records` gives, with `this` standing for the record's `thisKey`, and
      refuses the move where any is found or the count cannot be made; a line of `related` sets
      columns on a related record's rows after an applied move (1.4.0). A line of `refused`
      writes a history entry (`audit>`) or an alert (`notify>`) after a refused move, never after
      an applied one; a refused move still writes no line of `audit` or `notify` (1.5.0). A line
      of `withheld` (`move>attribute`) refuses the move to the person the record's attribute names,
      whatever their roles; a set-now field marked `@actor` is written with who made the move; and
      MoveRefusal, a form validator on a trigger form's hidden move field, judges the move before
      the act is saved and, where a condition the model words (`refusals`, `<condition>|<words>`;
      `fromState`) fails, says the words at the head of the form, filled from the record or from the
      other record's row that breaks the term, and writes the `refused` lines (1.6.0); a failed
      term the model gives no words is refused before the save all the same, in words drawn from
      the guard (`moveName`; the term the root guard asks, `rootAsks`, left to it), and a history
      entry's or an alert's column may hold `words`, the words of the refusal (1.7.0). Where
      `templates` names where the templates are kept (form>table>nameColumn>contentColumn), an
      alert's column may hold `template_key`, the identifier of the template row the notify names,
      and `content`, that row's content with its merge fields filled from the move and the record
      moved (1.8.0). Every row the guard makes (a history entry, an alert) or changes (the record
      moved, the act and the target saved, the rows a `related` line sets) carries the columns the
      platform fills when it saves a form's row - dateCreated, dateModified, the who-columns - by
      the rule of AppServiceImpl.storeFormData, from the one instant its moment is written from
      (the created three kept as loaded on a row changed); a move with no person, an empty name
      or the platform's roleAnonymous, is made by `system` in the history (1.9.0). Every property
      is generated by the kit's projectors from the model
      (tools/project_forms.py, tools/acts.py).
    registers:
      - com.fiscaladmin.joget.transitionguard.TransitionGuard
      - com.fiscaladmin.joget.transitionguard.MoveRefusal
    contract:
      plugin_class: com.fiscaladmin.joget.transitionguard.TransitionGuard
      config_keys: [entity, tableName, statusField, actionField, transitions, targetField,
                    targetKeyColumn, targetForm, actForm, actTable, checkRoles, reasonField,
                    copyFields, audit, notify, records, thisKey, related, refused, withheld,
                    templates]
      # MoveRefusal (1.6.0) is given the guard's keys and its own two
      validator_class: com.fiscaladmin.joget.transitionguard.MoveRefusal
      validator_keys: [refusals, fromState, moveName, rootAsks]
      transitions_format: "action>toState>nowField1,dayField@date,byField@actor>guardExpr>processId | ..."
    provenance: >
      the kit's lifecycle realisation (ADR-066 engine surface); target mode and checkRoles added
      by METHOD-2026-09-25-04 items 3 and 5 (1.2.0; MoveRolesTest, TransitionGuardTest); the day
      of a move, `audit` and `notify` by METHOD-2026-10-08-07 items 1 to 3 (1.3.0; MoveRowsTest);
      the guard over another record's rows (`records`, `thisKey`) and `related` by
      METHOD-2026-10-08-11 items 4 and 5 (1.4.0; OtherRecordsTest); `refused`, what a refused
      move writes, by METHOD-2026-10-12-14 under the owner's ruling of 11 October 2026 on round 1,
      card 4 (1.5.0); MoveRefusal, `withheld` and `@actor` by METHOD-2026-10-16-01, on MT-DM's
      request of 15 October 2026 (1.6.0; MoveRefusalTest, WithheldMoveTest); a refusal said in
      words where the model gives none, `moveName`, `rootAsks` and the source `words` by
      METHOD-2026-11-03-13, on MT-DM's hand-off of 22 October 2026 (1.7.0; MoveRefusalTest); an
      alert that points at its template and shows its words, `templates` and the sources
      `template_key` and `content`, by MT-DM's DM3-2026-10-27-159, applied by METHOD-2026-11-05-03
      on MT-DM's hand-off of 5 November 2026 (1.8.0; AlertWordsTest); the platform's columns on the
      rows it writes and changes, and `system` for a move with no person, by METHOD-2026-11-05-45
      on MT-DM's hand-off of 8 November 2026, item 46 (1.9.0; StampsTest).
      Entered here 25 Sep 2026 (METHOD-2026-09-25-01 item 23) under registry_version 0.11.0:
      the entry changes no generator, so the registry version does not move.
    source_of_truth: this repo

  - id: joget-decision-approval
    module: plugins/joget-decision-approval
    artifact: com.fiscaladmin.joget:joget-decision-approval
    version: 1.4.0
    category: foundation
    tier: P
    status: active            # service core (3a+3b) and its Joget plugins (3c, 165e2d3, 4 Jul 2026) shipped; ApprovalRouteEngine 1.2.0; RequesterWithheld 1.3.0; on jakarta.servlet 1.3.1; rows stamped as the platform stamps them 1.4.0
    ships: code
    license: proprietary            # FiscalAdmin OÜ
    dx_compat: ["8.1", "9.x"]
    java_release: 11
    depends_on: [joget-event-chain, joget-status-manager]
    summary: >
      Configurable decision & approval service. Ships the inversion seam — the DecisionEffect SPI
      and a static DecisionEffects registry the consumer's Activator populates, so the approval
      service never names a domain service — plus the full service core: ApprovalService (authority-
      matrix routing SINGLE/CHAIN/QUORUM, rank gate, four-eyes SoD, COI + auto-COI, escalation/timeout
      sweep, delegation binding, all audited to the event chain and guarded by StatusManager),
      DecisionService, AuthorityResolver (directory-resolved rank), MatrixValidator, ApprovalInbox,
      and a Rows helper; and its Joget plugins, registered by the bundle's Activator: the gate,
      sweep and delegate engines, the authority-matrix validator and the inbox binder (since
      commit 165e2d3, 4 July 2026). ApprovalRouteEngine (1.2.0) is the approval level by amount:
      a form post-processor in the transition guard's slot that runs the guard (by its class name,
      `guardClass`, through the plugin manager; nothing of the guard's is imported) and then, where
      the guard applied a routing move named in `routes` (`move>toState>amountAttr>levelAttr>
      actionType`), writes on the record the level of the mmAuthority band its amount falls in
      (ApprovalService.resolveRoute). The kit projects both the matrix and the engine from a
      process's `approval.bands` (tools/project_workflow.py, tools/project_forms.py).
      RequesterWithheld (1.3.0) is a permission on a form element that withholds an act from the
      record's requester: with `show` `others` it shows the element to a person in
      `allowedGroupIds` who did not ask for the record (the act bar of a move withheld from its
      requester), with `show` `requester` to the requester alone (the notice in place of the move's
      button on its own form); the record is the one `keyParam` names, by row id or `keyColumn`,
      read through `formDefId` from `tableName`, its requester `requesterColumn`. The kit projects it
      from a move's `withheld_from` (tools/project_forms.py). The decide path's four-eyes refusal
      is unchanged. Every row the service and its engines save - the approval, the decision, the
      route engine's record and act, the gate's, sweep's and delegate's records and the authority
      check - carries the columns the platform fills when it saves a form's row, by the rule of
      AppServiceImpl.storeFormData (a row made takes dateCreated, dateModified and the who-columns;
      a row changed takes dateModified and the modified-by pair, its created three kept as
      loaded) (1.4.0).
    registers:
      - com.fiscaladmin.joget.approval.ApprovalGateEngine
      - com.fiscaladmin.joget.approval.ApprovalSweepEngine
      - com.fiscaladmin.joget.approval.ApprovalDelegateEngine
      - com.fiscaladmin.joget.approval.AuthorityMatrixEngine
      - com.fiscaladmin.joget.approval.ApprovalInboxBinder
      - com.fiscaladmin.joget.approval.ApprovalRouteEngine
      - com.fiscaladmin.joget.approval.RequesterWithheld
    contract:
      exports_package: com.fiscaladmin.joget.approval
      classes: [DecisionEffect, DecisionEffects, ApprovalService, DecisionService, AuthorityResolver,
                MatrixValidator, ApprovalInbox, Rows]
      plugins: [ApprovalGateEngine, ApprovalSweepEngine, ApprovalDelegateEngine,
                AuthorityMatrixEngine, ApprovalInboxBinder, ApprovalRouteEngine, RequesterWithheld]
      # ApprovalRouteEngine's own keys; every other key it is given is the transition guard's,
      # passed to the guard unchanged (joget-transition-guard's config_keys)
      config_keys: [guardClass, routes]
      # RequesterWithheld's keys (1.3.0), a permission on a form element
      permission_keys: [show, allowedGroupIds, keyParam, keyColumn, formDefId, tableName,
                        requesterColumn]
      triggers: [cmApprovalDecision, cmApprovalSweep, cmApprovalDelegate, cmAuthorityCheck]
      spi: "consumer registers DecisionEffects.register(actionType, effect) at Activator start-up"
      carriers: [cmApproval, cmDecision, mmAuthority, mmCoi, mmRoleLevel, cmCase]
    provenance: >
      extracted + genericised from a collection-management building block (Phase 2, item 4); the
      Joget plugins by commit 165e2d3 (1.1.0); ApprovalRouteEngine by METHOD-2026-10-09-05 item 6
      (1.2.0; ApprovalRouteEngineTest). registry_version stays 0.11.0: the same round gave
      gen_userview (`chosen_actions`) and gen_datalists (`shownWhen`) one optional key each,
      absent which they emit as before (the kit's decision page of 9 October 2026, card 6).
      RequesterWithheld by METHOD-2026-10-16-01, on MT-DM's request of 15 October 2026 (1.3.0;
      RequesterWithheldTest); no generator changed, so registry_version stays 0.11.0.
      The platform's columns on every row saved (RowStamps) by METHOD-2026-11-05-45, on MT-DM's
      hand-off of 8 November 2026, item 46 (1.4.0; StampsTest); the registry's own version does
      not move.
    source_of_truth: this repo

