  - id: tree-menu
    module: plugins/tree-menu
    artifact: org.joget:tree_menu
    version: 8.1.12
    category: foundation
    tier: G
    status: active
    ships: code
    license: govstack
    dx_compat: ["8.1", "9.x"]
    java_release: 11
    summary: >
      Tree-navigation userview menu — renders a hierarchical tree (from a table or binder) with
